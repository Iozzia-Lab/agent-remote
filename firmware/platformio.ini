; PlatformIO project for M5Stack Core2.
; Build/upload:  pio run -t upload && pio device monitor
;
; Arduino IDE users can ignore this file — just open agent-remote.ino,
; select board "M5Core2", and install the M5Unified + ArduinoJson libraries.

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
    m5stack/M5Unified
    bblanchon/ArduinoJson @ ^7
build_flags =
    -DCORE_DEBUG_LEVEL=1
