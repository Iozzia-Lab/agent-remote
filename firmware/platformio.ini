; agent-remote firmware — M5Stack Core2
;
; IMPORTANT: build with PlatformIO, NOT arduino-cli.
; (In our dev environment the arduino-cli ESP32 toolchain produced broken
; binaries that boot-loop on real hardware; PlatformIO's self-contained
; toolchain compiles working firmware. Pinned to the espressif32 6.4.0
; platform = arduino-esp32 2.0.11 / IDF 4.4, which matches the Core2 factory
; firmware.)
;
; Build + flash + monitor:
;   pio run -t upload
;   pio device monitor
;
; If your Core2 shows up on a different serial port, edit upload_port below
; (find it with: pio device list).

[env:m5stack-core2]
platform = espressif32@6.4.0
board = m5stack-core2
framework = arduino
upload_speed = 115200
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@^0.1.16
